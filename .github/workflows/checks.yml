name: checks

# The generic repository checks that need no install of the calling repo's
# own dependencies, for any repository. Each runs only when the caller has
# what it reads, so a repo without one is not refused for it:
#
# - Records and frozen folders: @veda-hq/dvara's `records` and `frozen`
#   gates, with the caller's .dvara.json, at the dvara version the caller's
#   package.json pins, so its git hooks and its CI run one release.
# - Workflow lint: actionlint over .github/workflows, with ShellCheck behind
#   it for every `run:` script.
#
# Call it from one job, pinned:
#
#   jobs:
#     veda-checks:
#       permissions:
#         contents: read
#       uses: veda-hq/veda/.github/workflows/checks.yml@<commit>
#
# The job's result is the verdict: a caller's aggregate gate needs it like
# any other job.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version: 24

      # What each gate judges. A pull request: its commits since the base
      # branch. A push: the commits since the ref's previous tip; a new
      # branch (an all-zero or unknown `before`) gives every record in the
      # tree, and every commit since it left the default branch.
      - name: Records and frozen folders (dvara)
        if: ${{ hashFiles('.dvara.json') != '' }}
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version="$(jq -r '.devDependencies["@veda-hq/dvara"] // .dependencies["@veda-hq/dvara"] // empty' package.json)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::.dvara.json is here, but package.json pins no exact @veda-hq/dvara version (got '$version')"
            exit 1
          fi
          if [ -n "$BASE_REF" ]; then
            records=(--base "origin/$BASE_REF")
            frozen=(--base "origin/$BASE_REF")
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            records=(--base "$BEFORE")
            frozen=(--base "$BEFORE")
          else
            records=(--all)
            frozen=(--base "origin/$DEFAULT_BRANCH")
          fi
          status=0
          npx --yes "@veda-hq/dvara@$version" records "${records[@]}" || status=1
          npx --yes "@veda-hq/dvara@$version" frozen "${frozen[@]}" || status=1
          exit "$status"

      # Pinned by version and by the sha256 each release publishes, for both
      # runner architectures.
      - name: Install actionlint and ShellCheck
        id: lint-tools
        if: ${{ !cancelled() && hashFiles('.github/workflows/*.yml', '.github/workflows/*.yaml') != '' }}
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256_AMD64: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_SHA256_ARM64: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256_X86_64: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
          SHELLCHECK_SHA256_AARCH64: 68a8133197a50beb8803f8d42f9908d1af1c5540d4bb05fdfca8c1fa47decefc
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) AL_ARCH=amd64; AL_SHA="$ACTIONLINT_SHA256_AMD64"; SC_ARCH=x86_64; SC_SHA="$SHELLCHECK_SHA256_X86_64" ;;
            aarch64 | arm64) AL_ARCH=arm64; AL_SHA="$ACTIONLINT_SHA256_ARM64"; SC_ARCH=aarch64; SC_SHA="$SHELLCHECK_SHA256_AARCH64" ;;
            *) echo "::error::no pinned actionlint or ShellCheck for $(uname -m)"; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/lint-tools"
          mkdir -p "$dir"
          al="actionlint_${ACTIONLINT_VERSION}_linux_${AL_ARCH}.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$al" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${al}"
          echo "$AL_SHA  $RUNNER_TEMP/$al" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$al" -C "$dir" actionlint
          sc="shellcheck-v${SHELLCHECK_VERSION}.linux.${SC_ARCH}.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$sc" "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${sc}"
          echo "$SC_SHA  $RUNNER_TEMP/$sc" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$sc" -C "$dir" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          "$dir/actionlint" -version
          "$dir/shellcheck" --version | grep -qx "version: ${SHELLCHECK_VERSION}"
          echo "$dir" >> "$GITHUB_PATH"

      # Every workflow, with the repo's local actions, whose inputs actionlint
      # checks. ShellCheck is named, since actionlint quietly skips its check
      # of `run:` scripts without it; Python style stays out of it.
      - name: Workflow lint (actionlint)
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: actionlint -shellcheck="$(command -v shellcheck)" -pyflakes= -no-color
