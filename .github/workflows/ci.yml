name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # Each package's own tests prove the copy being changed. (`pnpm check`
      # runs these and the steps below, for a run by hand.)
      - run: pnpm -r check
      # The scripts' own tests: the version rule, released-pins, the git hooks.
      - name: Script tests
        run: >-
          node --test --experimental-test-coverage --test-coverage-lines=95 --test-coverage-functions=95
          --test-coverage-branches=90 '--test-coverage-include=scripts/*.mjs' '--test-coverage-exclude=scripts/*.test.mjs'
          scripts/*.test.mjs
      # The repository is guarded by the released guards the root pins, never
      # by packages/*/src, the copy being changed (T-9). Each @veda-hq pin is
      # that exact release, installed from the registry.
      - name: Guards are the pinned releases
        run: node scripts/released-pins.mjs
      # veda's own code, linted by the released shuddhi the root pins, never
      # packages/eslint-plugin-shuddhi. eslint-suppressions.json holds the
      # findings from before the lint; a new one fails, and a fixed one must be
      # pruned (`eslint . --prune-suppressions`), or eslint exits 2.
      - name: Lint (shuddhi)
        run: node_modules/.bin/eslint .
      # Veda never names a client (deny list: .veda/deny.sha256).
      - name: Boundary
        run: node_modules/.bin/pariksha boundary
      - name: Required settings
        run: |
          node_modules/.bin/pariksha required-settings --require .veda/required-settings.json
          node_modules/.bin/pariksha required-settings --require node_modules/@veda-hq/pariksha/baselines/claude-settings.json
      - name: sarathi settings
        run: node_modules/.bin/sarathi check --settings .claude/settings.json
      # Other repositories call the shared workflows here, so every one must lint clean.
      # Pinned by version and by the sha256 its release checksums publish; the
      # same release checks.yml installs. It stays in this required job until
      # main's ruleset also requires "checks / Checks".
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          TAR="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$TAR" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${TAR}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$TAR" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$TAR" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # The shared checks other repositories call, run here from this commit, so a
  # change to the workflow is proven before anyone pins it. Its dvara gates
  # run the released @veda-hq/dvara the root package.json pins, with
  # .dvara.json, as the git hooks do.
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      require: dvara,actionlint
    permissions:
      contents: read

  # The marketplace and its plugins validate, and the plugins' own tests pass, under
  # one pinned Claude Code build: its linux-x64 npm tarball, checked against its sha256.
  plugins:
    name: Plugins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate and test
        env:
          CLAUDE_CODE_VERSION: 2.1.318
          CLAUDE_CODE_SHA256: 2a4d5e3bd0f5bd2959bb1955bd99ea97f57af162681991dcae00fee82f9d554f
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/claude-code"
          mkdir -p "$DIR"
          TGZ="claude-code-linux-x64-${CLAUDE_CODE_VERSION}.tgz"
          curl -fsSL --retry 3 -o "$DIR/$TGZ" \
            "https://registry.npmjs.org/@anthropic-ai/claude-code-linux-x64/-/${TGZ}"
          echo "${CLAUDE_CODE_SHA256}  $DIR/$TGZ" | sha256sum -c -
          tar -xzf "$DIR/$TGZ" -C "$DIR" package/claude
          CLAUDE="$DIR/package/claude"
          "$CLAUDE" --version
          "$CLAUDE" plugin validate .
          for plugin in $(jq -r '.plugins[].source' .claude-plugin/marketplace.json); do
            "$CLAUDE" plugin validate "$plugin"
          done
          "$CLAUDE" plugin test packages/needs-you

  # Every unreleased package version is the next legal release (README.md, "Releasing").
  # Run from the last release, as in release.yml; the tests above check the copy being changed.
  version-rule:
    uses: veda-hq/veda/.github/workflows/version-rule.yml@3038b11092afd1e65bab64f182012b349c0d82f8 # v0.5.2
    with:
      veda-ref: 3038b11092afd1e65bab64f182012b349c0d82f8 # v0.5.2
    permissions:
      contents: read
      actions: read

  secrets:
    name: Secret scans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Both scanners are pinned by version and by the sha256 their release
      # checksums publish. Gitleaks matches patterns; TruffleHog also verifies
      # what it finds against the issuing service.
      - name: Gitleaks and TruffleHog over the whole history
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          TRUFFLEHOG_VERSION: 3.99.7
          TRUFFLEHOG_SHA256: bdbea0508e439b144f49de14e775908de5f902f3d14ea7ae8354bae72b0b72ef
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/scanners"
          mkdir -p "$DIR"
          GL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          TH="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$DIR/$GL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GL}"
          curl -fsSL --retry 3 -o "$DIR/$TH" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/${TH}"
          echo "${GITLEAKS_SHA256}  $DIR/$GL" | sha256sum -c -
          echo "${TRUFFLEHOG_SHA256}  $DIR/$TH" | sha256sum -c -
          tar -xzf "$DIR/$GL" -C "$DIR" gitleaks
          tar -xzf "$DIR/$TH" -C "$DIR" trufflehog
          "$DIR/gitleaks" git --no-banner --redact --config=.gitleaks.toml .
          "$DIR/trufflehog" git "file://$PWD" --no-update --fail --results=verified,unknown
