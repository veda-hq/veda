name: cosmic-ray timing

# Slice #271 (work item #238): how long cosmic-ray 8.9.0 takes to mutate
# kavach's Python, module by module, with kavach's own unittest command, on a
# CI runner. It lives only on its draft pull request, which is closed once the
# numbers are on #238, and never merges. cosmic-ray is installed in the job,
# so nothing else in the repository changes.

on:
  pull_request:
    paths:
      - .github/workflows/cosmic-ray-timing.yml

permissions:
  contents: read

concurrency:
  group: cosmic-ray-timing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  time:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    # GitHub-hosted jobs stop at 360 minutes.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        # __init__.py (11 lines of imports) is left out.
        module:
          - boundary
          - git_safety
          - bash_guard
          - worktree_guard
          - clone_writers
          - rules
          - config
          - command_guard
          - refusal_log
          - tool_guard
    env:
      MODULE: ${{ matrix.module }}
      # kavach's own command (`pnpm test:python`) with -f: the first failing
      # test ends the run, which kills the mutant all the same.
      TEST_COMMAND: python3 -B -m unittest discover -f -s python/tests -t python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add cosmic-ray 8.9.0 (this job only)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cosmic-ray==8.9.0
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: The runner
        run: |
          {
            echo "### ${MODULE}.py ($(wc -l < "packages/kavach/python/kavach/${MODULE}.py") lines)"
            echo
            echo "- Runner: $(nproc) CPUs, $(lscpu | sed -n 's/^Model name: *//p'), $(free -g | awk '/^Mem:/ {print $2}') GiB, $(python3 --version), cosmic-ray $(pip show cosmic-ray | sed -n 's/^Version: //p')"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The suite alone
        working-directory: packages/kavach
        run: |
          set -euo pipefail
          start=$(date +%s)
          # TEST_COMMAND is a command line, split on spaces on purpose.
          # shellcheck disable=SC2086
          $TEST_COMMAND
          end=$(date +%s)
          echo "- Suite alone: $(( end - start )) s" >> "$GITHUB_STEP_SUMMARY"
      - name: One worker per CPU, each in its own copy
        # cosmic-ray mutates the file in place, so each worker runs in a copy.
        # The copy keeps the folder name `kavach`: a test reads it.
        run: |
          set -euo pipefail
          urls=""
          for i in $(seq 1 "$(nproc)"); do
            port=$(( 9875 + i ))
            mkdir -p "$RUNNER_TEMP/w$i"
            cp -R packages/kavach "$RUNNER_TEMP/w$i/kavach"
            (cd "$RUNNER_TEMP/w$i/kavach" && nohup cosmic-ray http-worker --port "$port" > "$RUNNER_TEMP/w$i.log" 2>&1 &)
            urls="${urls:+$urls, }\"http://localhost:$port\""
          done
          cat > "$RUNNER_TEMP/cr.toml" <<EOF
          [cosmic-ray]
          module-path = "python/kavach/${MODULE}.py"
          timeout = 900.0
          excluded-modules = []
          test-command = "${TEST_COMMAND}"

          [cosmic-ray.distributor]
          name = "http"

          [cosmic-ray.distributor.http]
          worker-urls = [${urls}]
          EOF
          cat "$RUNNER_TEMP/cr.toml"
          sleep 5
      - name: Plan the mutants
        working-directory: packages/kavach
        run: |
          set -euo pipefail
          start=$(date +%s)
          cosmic-ray init "$RUNNER_TEMP/cr.toml" "$RUNNER_TEMP/${MODULE}.sqlite"
          end=$(date +%s)
          planned=$(cosmic-ray dump "$RUNNER_TEMP/${MODULE}.sqlite" | wc -l)
          echo "- Planned: ${planned} mutants (init $(( end - start )) s)" >> "$GITHUB_STEP_SUMMARY"
      - name: cosmic-ray exec
        working-directory: packages/kavach
        run: |
          set -uo pipefail
          start=$(date +%s)
          # Stopped well below the job's cap, so a module that cannot finish
          # still reports how far it got. Each result is saved as it lands.
          timeout 315m cosmic-ray exec "$RUNNER_TEMP/cr.toml" "$RUNNER_TEMP/${MODULE}.sqlite"
          status=$?
          end=$(date +%s)
          secs=$(( end - start ))
          if [ "$status" -eq 124 ]; then
            echo "- exec: stopped at the 315 min limit, unfinished" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- exec: exit ${status}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- exec time: $(( secs / 60 )) min $(( secs % 60 )) s" >> "$GITHUB_STEP_SUMMARY"
          echo "EXEC_SECS=${secs}" >> "$GITHUB_ENV"
      - name: Results
        if: always()
        working-directory: packages/kavach
        run: |
          set -uo pipefail
          db="$RUNNER_TEMP/${MODULE}.sqlite"
          [ -f "$db" ] || exit 0
          cosmic-ray dump "$db" > "$RUNNER_TEMP/${MODULE}.jsonl"
          counts=$(jq -rs '
            def r: .[1];
            (map(select(r != null))) as $done
            | "planned \(length), done \($done | length), "
              + ($done | map("\(r.test_outcome // "none")/\(r.worker_outcome)") | group_by(.) | map("\(.[0]) \(length)") | join(", "))
          ' "$RUNNER_TEMP/${MODULE}.jsonl")
          survived=$(jq -s '[.[] | select(.[1] != null and .[1].test_outcome == "survived")] | length' "$RUNNER_TEMP/${MODULE}.jsonl")
          done_count=$(jq -s '[.[] | select(.[1] != null)] | length' "$RUNNER_TEMP/${MODULE}.jsonl")
          {
            echo "- Outcomes: ${counts}"
            echo "- Surviving: ${survived}"
            if [ -n "${EXEC_SECS:-}" ] && [ "$done_count" -gt 0 ]; then
              echo "- Per mutant (wall, $(nproc) workers): $(( EXEC_SECS * 1000 / done_count )) ms"
            fi
            echo
            echo '<details><summary>cr-report</summary>'
            echo
            echo '```'
            cr-report "$db" | tail -n 5
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          cr-report "$db" --show-output > "$RUNNER_TEMP/${MODULE}-report.txt" || true
          cr-html "$db" > "$RUNNER_TEMP/${MODULE}.html" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cosmic-ray-timing-${{ matrix.module }}
          path: |
            ${{ runner.temp }}/*.sqlite
            ${{ runner.temp }}/*.jsonl
            ${{ runner.temp }}/*.txt
            ${{ runner.temp }}/*.html
            ${{ runner.temp }}/w*.log
          if-no-files-found: ignore
