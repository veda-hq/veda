# TEMPORARY (#108): loops the Script tests step to catch the sarathi-hook
# install race on Linux with traces. Never merged.
name: flake-diag

on:
  pull_request:

permissions:
  contents: read

jobs:
  loop:
    name: loop ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version-file: .nvmrc
      # Does mkdir alone let two racing callers both succeed?
      - name: mkdir race
        run: |
          command -v mkdir; readlink -f "$(command -v mkdir)"; mkdir --version | head -2
          ls /usr/bin/gnumkdir /usr/lib/cargo/bin 2>&1 | head -5 || true
          race() {
            local tool="$1" both=0
            for i in $(seq 1 2000); do
              d="$RUNNER_TEMP/race-$2-$i"
              out="$( { "$tool" "$d" 2>/dev/null && echo ok & "$tool" "$d" 2>/dev/null && echo ok & wait; } | grep -c ok)"
              [ "$out" -eq 2 ] && both=$((both + 1))
            done
            echo "$tool: both succeeded in $both of 2000"
          }
          race mkdir default
          if [ -x /usr/bin/gnumkdir ]; then race /usr/bin/gnumkdir gnu; fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r check
      - name: Loop Script tests
        env:
          SARATHI_TRACE: '1'
        run: |
          git --version; dpkg-query -W findutils; grep PRETTY /etc/os-release; nproc; echo "TMPDIR=${TMPDIR:-unset}"; ls -la /tmp
          fails=0
          for i in $(seq 1 25); do
            if ! node --test --experimental-test-coverage --test-coverage-lines=95 --test-coverage-functions=95 \
              --test-coverage-branches=90 '--test-coverage-include=scripts/*.mjs' '--test-coverage-exclude=scripts/*.test.mjs' \
              scripts/*.test.mjs > "$RUNNER_TEMP/run-$i.log" 2>&1; then
              fails=$((fails + 1))
              echo "::group::run $i failed"
              grep -n -E "✖|actual|expected|trace|not ok|Error" "$RUNNER_TEMP/run-$i.log" | head -120
              ls -la /tmp
              echo "::endgroup::"
            fi
            grep -h "two sessions starting at once" "$RUNNER_TEMP/run-$i.log" | head -1
          done
          echo "failures: $fails of 25"
          # Fail the job on a catch, so the failure is seen without polling.
          [ "$fails" -eq 0 ]
