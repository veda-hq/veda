name: Mutation

# veda's mutation gate on pull requests (veda#273): one job per agnipariksha
# lane with a file to judge, each running the released agnipariksha the root
# pins with `--lane`, so it judges its lane in full whatever the pre-push
# cut-off (`maxLines` in agnipariksha.json). The "Mutation" job is the one
# check main's ruleset is to require, once this workflow is on main: niyam's
# Guard refuses a pull request that adds a job reporting a check the ruleset
# already requires.
#
# No `paths:` filter, so the gate's check reports on every pull request,
# and no `workflow_dispatch`, whose run would post the gate as skipped on the
# pull request's head (docs/lessons/github-actions.md).

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The lanes agnipariksha would judge a file in, by its own plan
  # (scripts/mutation-lanes.mjs), with the base and --tracked-only the lane
  # jobs use. A lane left out has nothing to judge.
  plan:
    name: Mutation lanes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - id: plan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/mutation-lanes.mjs --base "origin/$BASE_REF" >> "$GITHUB_OUTPUT"

  lane:
    # A fixed name: GitHub appends each leg's matrix value, as "Lane (kavach)".
    # niyam's Guard refuses a job name holding an expression, since it could
    # report a required check (niyam-guard / judge among them).
    name: Lane
    needs: plan
    # An empty matrix is an error, so the job runs only when a lane has work.
    if: ${{ needs.plan.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    # pariksha's cli.ts alone took at least 25 minutes on a 4-CPU runner (#238),
    # and agnipariksha's timeout retries may take 15 more.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # Exit 1 is a blocking mutant and 2 a refusal: both fail the job.
      - name: agnipariksha
        env:
          LANE: ${{ matrix.lane }}
          BASE_REF: ${{ github.base_ref }}
        run: node_modules/.bin/agnipariksha --lane "$LANE" --base "origin/$BASE_REF" --tracked-only --no-reuse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: mutation-${{ strategy.job-index }}
          path: reports/agnipariksha
          if-no-files-found: ignore

  # Passes when the plan ran and every lane with work passed. A skipped lane
  # job is a pass only when the plan found no lane with work.
  gate:
    name: Mutation
    needs: [plan, lane]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          ANY: ${{ needs.plan.outputs.any }}
          LANES: ${{ needs.lane.result }}
        run: |
          set -euo pipefail
          echo "plan: $PLAN, lanes with work: ${ANY:-unknown}, lane jobs: $LANES"
          if [ "$PLAN" != success ]; then
            echo "::error::the mutation plan did not succeed ($PLAN), so no lane was judged"
            exit 1
          fi
          case "$ANY/$LANES" in
            true/success) echo "every lane with work passed" ;;
            false/skipped) echo "no lane has a file to judge" ;;
            *) echo "::error::lanes with work: $ANY, lane jobs: $LANES"; exit 1 ;;
          esac
