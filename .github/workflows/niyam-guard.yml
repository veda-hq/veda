# Written by niyam onboard: the shared Guard's caller. onboard writes it again on every run, its pin
# moving with .github/workflows/niyam.yml's; change it by running onboard, not by hand. It holds nothing a pull
# request could weaken: pull_request_target runs the default branch's copy of it, and the Guard it
# calls runs from the niyam release it pins. Its check is niyam-guard / judge.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  niyam-guard:
    name: niyam-guard
    # Not on an edit of Mergify's queue draft that changes no title or base: its head's runs stand (veda-hq/niyam#685).
    if: >-
      ${{ !(github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base &&
      github.event.pull_request.user.login == 'mergify[bot]' && github.event.pull_request.user.type == 'Bot' &&
      startsWith(github.event.pull_request.head.ref, 'mergify/merge-queue/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.title, ' pull requests ahead')) }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
    uses: veda-hq/niyam/.github/workflows/shared-guard.yml@v0.8.0
