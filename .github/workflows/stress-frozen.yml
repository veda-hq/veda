name: stress-frozen

# STRESS-ONLY, never merged: runs dvara's frozen.test.ts many times on
# GitHub's Linux runners, where it once failed with ENOENT while copying its
# template repository (#50).
on:
  pull_request:
    paths: ['.github/workflows/stress-frozen.yml', 'packages/dvara/**']

permissions:
  contents: read

jobs:
  stress:
    name: Stress frozen.test.ts (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: git --version
      - name: 150 runs, 4 at a time, beside 2 busy loops
        working-directory: packages/dvara
        run: node ../../scripts/stress-frozen.mjs 150 4 2
