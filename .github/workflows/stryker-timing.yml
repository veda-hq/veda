name: Stryker timing

# Slice #252 (work item #238, question 2): how long Stryker lanes shaped as
# agnipariksha would shape them take on a CI runner. It lives only on its
# draft pull request, which is closed once the numbers are on #238, and never
# merges. Stryker is installed in the job, so package.json does not change.

on:
  pull_request:
    paths:
      - .github/workflows/stryker-timing.yml
      - .github/stryker-timing/**

permissions:
  contents: read

concurrency:
  group: stryker-timing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  time:
    name: ${{ matrix.sample }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sample: sarathi-248, package: sarathi, runs: 2, suites: src/cli.test.ts }
          # cli.test.ts spawns bin.ts once, and tap sees no coverage from a
          # child process: the command twin shows whether verdicts differ.
          - { sample: sarathi-248-command, package: sarathi, runs: 1, suites: src/cli.test.ts }
          - { sample: pariksha-169, package: pariksha, runs: 2, suites: src/cli.test.ts src/regression-controls.test.ts src/selection.test.ts }
          - { sample: agnipariksha-185, package: agnipariksha, runs: 2, suites: src/cli.test.ts src/config.test.ts src/failed-tests.test.ts src/lanes.test.ts src/suite-owner.test.ts }
          - { sample: kavach-141, package: kavach, runs: 2, suites: src/rule-checks/registry.test.ts src/rule-checks/runtime.test.ts }
          - { sample: dvara-143, package: dvara, runs: 2, suites: src/cli.test.ts src/exec-bits.test.ts src/review-size.test.ts }
          - { sample: pair-tap, package: pariksha, runs: 2, suites: src/semver-range.test.ts src/codec-registry.test.ts }
          - { sample: pair-command, package: pariksha, runs: 1, suites: src/semver-range.test.ts src/codec-registry.test.ts }
    env:
      SAMPLE: ${{ matrix.sample }}
      RUNS: ${{ matrix.runs }}
      SUITES: ${{ matrix.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Add Stryker 10.1.1 and its tap runner (this job only)
        run: pnpm add -w -D @stryker-mutator/core@10.1.1 @stryker-mutator/tap-runner@10.1.1
      - name: The runner
        run: |
          {
            echo "### ${SAMPLE}"
            echo
            echo "- Runner: $(nproc) CPUs, $(lscpu | sed -n 's/^Model name: *//p'), $(free -g | awk '/^Mem:/ {print $2}') GiB, Node $(node --version)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The suites alone
        working-directory: packages/${{ matrix.package }}
        run: |
          set -euo pipefail
          start=$(date +%s%N)
          # SUITES is a space-separated list of test files.
          # shellcheck disable=SC2086
          node --test $SUITES
          end=$(date +%s%N)
          echo "- Suites alone: $(( (end - start) / 1000000 )) ms" >> "$GITHUB_STEP_SUMMARY"
      - name: Stryker
        # Below the job's cap, so the reports of finished runs still upload.
        timeout-minutes: 105
        working-directory: packages/${{ matrix.package }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reports"
          for run in $(seq 1 "$RUNS"); do
            start=$(date +%s)
            pnpm exec stryker run "../../.github/stryker-timing/${SAMPLE}.json" --concurrency "$(nproc)"
            end=$(date +%s)
            report="$RUNNER_TEMP/reports/${SAMPLE}-run${run}.json"
            mv stryker-report.json "$report"
            mutants=$(jq '[.files[].mutants[]] | length' "$report")
            blocking=$(jq '[.files[].mutants[] | select(.status == "Survived" or .status == "NoCoverage")] | length' "$report")
            statuses=$(jq -r '[.files[].mutants[].status] | group_by(.) | map("\(.[0]) \(length)") | join(", ")' "$report")
            echo "- Run ${run}: $(( (end - start) / 60 )) min $(( (end - start) % 60 )) s, ${mutants} mutants, ${blocking} blocking (${statuses})" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stryker-timing-${{ matrix.sample }}
          path: ${{ runner.temp }}/reports
          if-no-files-found: ignore
